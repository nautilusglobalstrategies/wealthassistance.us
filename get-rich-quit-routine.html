<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A practical wealth-building routine designed to help you move from financial noise to confident next steps.">
  <title>The Get Rich, Quit Routine | Wealth Assistance</title>
  <style>
    :root {
      --ink: #09262a;
      --ink-soft: #173d40;
      --paper: #f7f5ef;
      --cream: #fffdf8;
      --sea: #0e6966;
      --sea-dark: #07514f;
      --gold: #d9aa55;
      --gold-pale: #f4e5bf;
      --mist: #dbe9e5;
      --muted: #5f7475;
      --line: rgba(9, 38, 42, .13);
      --shadow: 0 20px 60px rgba(9, 38, 42, .14);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
    .wrap { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      color: var(--sea);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      background: var(--gold);
    }

    .site-header {
      position: absolute;
      z-index: 2;
      inset: 0 0 auto;
      padding: 24px 0;
      color: var(--cream);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
      letter-spacing: -.03em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 37px;
      height: 37px;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 50%;
      color: var(--gold-pale);
      font-family: Georgia, serif;
      font-size: 1.35rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: .92rem;
      font-weight: 650;
    }

    .nav-links a:not(.nav-cta) { opacity: .85; }
    .nav-cta {
      border: 1px solid rgba(255, 255, 255, .6);
      border-radius: 999px;
      padding: 9px 15px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 157px 0 103px;
      color: var(--cream);
      background:
        radial-gradient(circle at 84% 15%, rgba(217, 170, 85, .34), transparent 20rem),
        radial-gradient(circle at 71% 74%, rgba(32, 130, 123, .32), transparent 25rem),
        linear-gradient(130deg, #06252a 0%, #0a3c3f 52%, #0d5b59 100%);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -12vw;
      bottom: -21vw;
      width: min(55vw, 680px);
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 50%;
      box-shadow: 0 0 0 42px rgba(255, 255, 255, .035), 0 0 0 84px rgba(255, 255, 255, .025);
      pointer-events: none;
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.16fr) minmax(280px, .84fr);
      align-items: end;
      gap: 70px;
    }

    .hero .eyebrow { color: var(--gold-pale); }

    .hero h1 {
      max-width: 760px;
      margin: 18px 0 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.1rem, 6vw, 5.6rem);
      font-weight: 400;
      letter-spacing: -.065em;
      line-height: .98;
    }

    .hero h1 em { color: var(--gold-pale); font-style: italic; }

    .hero-copy {
      max-width: 640px;
      margin: 0;
      color: rgba(255, 253, 248, .82);
      font-size: clamp(1.03rem, 1.6vw, 1.18rem);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 17px;
      margin-top: 32px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 51px;
      padding: 0 23px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: .93rem;
      font-weight: 800;
      transition: transform .18s ease, background .18s ease, color .18s ease;
    }

    .button:hover { transform: translateY(-2px); }
    .button-primary { background: var(--gold); color: #172b2c; }
    .button-primary:hover { background: #e5bd72; }
    .button-quiet { border-color: rgba(255, 255, 255, .42); color: var(--cream); }
    .hero-note { color: rgba(255, 253, 248, .64); font-size: .82rem; }

    .hero-card {
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 18px;
      background: rgba(255, 255, 255, .08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .16);
      backdrop-filter: blur(10px);
    }

    .hero-card p { margin: 0; color: rgba(255, 253, 248, .7); font-size: .91rem; }

    .hero-card strong {
      display: block;
      margin: 9px 0 21px;
      font-family: Georgia, serif;
      font-size: 1.74rem;
      font-weight: 400;
      line-height: 1.12;
    }

    .mini-list {
      display: grid;
      gap: 13px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .mini-list li { display: flex; gap: 10px; align-items: flex-start; font-size: .91rem; }
    .mini-list li::before { content: "✓"; color: var(--gold-pale); font-weight: 900; }

    .trust-bar { background: var(--cream); border-bottom: 1px solid var(--line); }

    .trust-grid {
      display: grid;
      grid-template-columns: 1.2fr repeat(3, 1fr);
      align-items: center;
      gap: 20px;
      padding: 27px 0;
    }

    .trust-intro { color: var(--muted); font-size: .85rem; }
    .trust-stat { padding-left: 23px; border-left: 1px solid var(--line); }

    .trust-stat strong {
      display: block;
      color: var(--sea);
      font-family: Georgia, serif;
      font-size: 1.34rem;
      font-weight: 400;
    }

    .trust-stat span { color: var(--muted); font-size: .76rem; }

    section { padding: 100px 0; }
    .section-heading { max-width: 710px; }

    h2 {
      margin: 13px 0 17px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.25rem, 4.2vw, 3.55rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: 1.04;
    }

    .lead { max-width: 620px; margin: 0; color: var(--muted); font-size: 1.08rem; }
    .routine { background: var(--paper); }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 48px;
    }

    .step {
      min-height: 285px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--cream);
    }

    .step-number {
      display: block;
      margin-bottom: 52px;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 1.4rem;
    }

    .step h3 { margin: 0 0 10px; font-size: 1.17rem; letter-spacing: -.025em; }
    .step p { margin: 0; color: var(--muted); font-size: .94rem; }

    .split { background: var(--ink); color: var(--cream); }

    .split-grid {
      display: grid;
      grid-template-columns: .92fr 1.08fr;
      gap: 80px;
      align-items: center;
    }

    .split .eyebrow { color: var(--gold-pale); }
    .split h2 { margin-top: 14px; }
    .split .lead { color: rgba(255, 253, 248, .7); }

    .principles {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid rgba(255, 255, 255, .17);
    }

    .principles li {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 16px;
      padding: 23px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .17);
    }

    .principles b {
      color: var(--gold-pale);
      font-family: Georgia, serif;
      font-size: 1.35rem;
      font-weight: 400;
    }

    .principles strong { display: block; margin-bottom: 4px; font-size: 1rem; }
    .principles span { color: rgba(255, 253, 248, .67); font-size: .9rem; }

    .proof { background: var(--mist); }

    .proof-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 70px;
      align-items: start;
    }

    .proof-label {
      display: inline-block;
      margin-top: 26px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(14, 105, 102, .12);
      color: var(--sea-dark);
      font-size: .73rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .quote {
      margin: 0;
      padding: 32px;
      border-radius: 14px;
      background: var(--cream);
      box-shadow: var(--shadow);
    }

    .quote p {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      letter-spacing: -.035em;
      line-height: 1.2;
    }

    .quote footer { margin-top: 24px; color: var(--muted); font-size: .84rem; }
    .quote footer strong { display: block; color: var(--ink); }
    .placeholder-note { margin: 14px 4px 0; color: var(--muted); font-size: .78rem; }

    .cta { padding: 92px 0; background: var(--cream); }

    .cta-box {
      position: relative;
      overflow: hidden;
      padding: clamp(38px, 6vw, 72px);
      border-radius: 19px;
      color: var(--cream);
      background: linear-gradient(125deg, #0b393c, #126c67);
    }

    .cta-box::after {
      content: "";
      position: absolute;
      width: 380px;
      height: 380px;
      right: -108px;
      top: -192px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 50%;
      box-shadow: 0 0 0 45px rgba(255, 255, 255, .045);
    }

    .cta-content { position: relative; z-index: 1; max-width: 690px; }
    .cta h2 { margin-top: 13px; }
    .cta p { max-width: 570px; color: rgba(255, 253, 248, .76); }
    .cta .hero-actions { margin-top: 27px; }
